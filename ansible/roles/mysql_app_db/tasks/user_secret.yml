---
# Runs once per user (loop_var: mysql_app_db_user). The password is generated the first
# time and stored in Secret Manager; later runs read it, so reruns don't change it.
- name: "Look for the user secret: {{ mysql_app_db_user.name }}"
  ansible.builtin.command:
    cmd: >-
      gcloud secrets describe {{ mysql_app_db_secret_prefix }}-{{ mysql_app_db_user.name }}-password
      --project={{ gcp_project }} --format=value(name)
  register: mysql_app_db_secret_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Create the user secret with a random password: {{ mysql_app_db_user.name }}"
  ansible.builtin.command:
    cmd: >-
      gcloud secrets create {{ mysql_app_db_secret_prefix }}-{{ mysql_app_db_user.name }}-password
      --project={{ gcp_project }}
      --replication-policy=automatic
      --labels=env=dev,managed_by=ansible,repo=infrastructure
      --data-file=-
    stdin: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits', '-_=+.:']) }}"
    stdin_add_newline: false
  when: mysql_app_db_secret_lookup.rc != 0
  changed_when: true
  no_log: true

- name: "Read the user password: {{ mysql_app_db_user.name }}"
  ansible.builtin.command:
    cmd: >-
      gcloud secrets versions access latest
      --secret={{ mysql_app_db_secret_prefix }}-{{ mysql_app_db_user.name }}-password
      --project={{ gcp_project }}
  register: mysql_app_db_user_secret
  changed_when: false
  check_mode: false
  no_log: true
  # In --check mode a new secret isn't created, so there is nothing to read yet.
  when: mysql_app_db_secret_lookup.rc == 0 or not ansible_check_mode

- name: "Keep the user password in memory: {{ mysql_app_db_user.name }}"
  ansible.builtin.set_fact:
    mysql_app_db_passwords: >-
      {{ mysql_app_db_passwords | default({})
         | combine({mysql_app_db_user.name: mysql_app_db_user_secret.stdout | default('check-mode-placeholder')}) }}
  no_log: true
